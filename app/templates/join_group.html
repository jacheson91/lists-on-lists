{% extends "base.html" %}

{% block title %}Join group{% endblock %}

{% block content %}
<div class="general-card narrow">
    <h1>Join a group</h1>
    <p>Enter the code you were given to join an existing group.</p>
    
    <form method="POST">
        <div class="form-group">
            <label for="join_code">Join code</label>
            <input type="text" id="join_code" name="join_code" required 
                   placeholder="6 characters" maxlength="6" 
                   class="code-input" autocomplete="off">
        </div>
        
        <button type="submit" class="btn-primary">Join group</button>
        <a href="{{ url_for('dashboard') }}" class="btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
