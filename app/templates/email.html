<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            /* Email clients ignore web fonts and flexbox, so this sticks to a system stack
               and simple block layout. */
            body {
                margin: 0;
                padding: 32px 16px;
                background-color: #f3f8f7;
                color: #172625;
                font-family: Figtree, "Segoe UI", Helvetica, Arial, sans-serif;
                font-size: 16px;
                line-height: 1.6;
            }

            .general-card {
                background: #ffffff;
                max-width: 560px;
                margin: 0 auto;
                padding: 32px 36px 36px;
                border: 1px solid #dde8e6;
                border-radius: 16px;
            }

            .logo {
                text-align: center;
                margin-bottom: 24px;
                font-size: 26px;
                font-weight: 700;
                color: #05605e;
            }

            .logo img {
                width: 40px;
                height: 40px;
                vertical-align: middle;
                margin-right: 8px;
            }

            p {
                margin: 0 0 16px;
            }

            .btn-primary {
                display: inline-block;
                padding: 12px 22px;
                margin: 4px 0 20px;
                background: #087a77;
                color: #ffffff;
                border-radius: 8px;
                font-weight: 600;
                text-decoration: none;
            }

            .fine-print {
                color: #566866;
                font-size: 14px;
            }

            a {
                color: #087a77;
            }
        </style>
    </head>
    <body>
        <div class="general-card">
            <div class="logo">
                <img src="../static/favicon.png" alt="">Giftster
            </div>
            <p>We received a request to reset your password.</p>
            <a href="{reset_url}" class="btn-primary">Reset password</a>
            <p class="fine-print">This link expires in one hour. If you didn’t request a new password, you can ignore this message.</p>
            <p class="fine-print">Questions? Contact <a href="mailto:help@giftster.app">help@giftster.app</a>.</p>
        </div>
    </body>
</html>
