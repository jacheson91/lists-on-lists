<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Giftster{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    {% if current_user.is_authenticated %}
    <div class="toolbar">
        <a href="{{ url_for('dashboard') }}" class="toolbar-brand">
            <img src="{{ url_for('static', filename='favicon.png') }}" alt="">
            <span>Giftster</span>
        </a>
        <nav class="toolbar-nav">
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('wishlist') }}">Wishlist</a>
          <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </nav>
    </div>
    {% endif %}
    {# Auth pages override this to show messages inside their card #}
    {% block flashes %}
      {% if get_flashed_messages() %}
        <div class="flash-container">{% include '_flashes.html' %}</div>
      {% endif %}
    {% endblock %}
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
